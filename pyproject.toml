[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-uav-wing"
version = "0.1.0"
description = "AI-Assisted Wing CFD and Parametric Optimization for Small UAVs"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
